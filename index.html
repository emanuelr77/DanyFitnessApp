<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dany Fitness - Workout Timer</title>
    <link rel="manifest" href="./manifest.json">
    <style>body{font-family:Arial;background:#1a1a1a;color:#fff;text-align:center;padding:20px}.btn-install{display:none;width:100%;padding:12px;background:#FF6B35;color:white;border:none;font-size:16px;cursor:pointer;margin:15px 0}</style>
</head>
<body>
    <h1>💪 DANY FITNESS</h1>
    <p>App de entrenamiento</p>
    <button id="installBtn" class="btn-install">📱 Instalar como App</button>
    
    <p style="margin-top:40px;color:#aaa;font-size:12px">
        <a href="https://emanuelr77.github.io/DanyFitnessApp/" style="color:#FF6B35">Abre la app aquí</a>
    </p>

    <script>
        if('serviceWorker' in navigator){
            navigator.serviceWorker.register('./sw.js').catch(e=>console.log('SW error'));
        }
        
        let p;
        window.addEventListener('beforeinstallprompt',e=>{
            e.preventDefault();
            p=e;
            document.getElementById('installBtn').style.display='block';
        });
        
        document.getElementById('installBtn').addEventListener('click',async()=>{
            if(p){
                p.prompt();
                p=null;
                document.getElementById('installBtn').style.display='none';
            }
        });
        
        window.addEventListener('appinstalled',()=>{
            document.getElementById('installBtn').style.display='none';
        });
    </script>
</body>
</html>
