<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CONTROL DE VERSION / BUILD -->
    <meta name="app-version" content="1.0.31">
    
    <!-- ENLACE AL MANIFEST E ICONOS -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script>
        (function() {
            const currentVersion = document.querySelector('meta[name="app-version"]').getAttribute('content');
            const savedVersion = localStorage.getItem('danyFitness_version');

            // 1. DESREGISTRAR SERVICE WORKERS
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    for (let registration of registrations) {
                        registration.unregister();
                    }
                });
            }

            // 2. PURGAR CACHESTORAGE
            if ('caches' in window) {
                caches.keys().then((names) => {
                    for (let name of names) {
                        caches.delete(name);
                    }
                });
            }

            // 3. FORZAR RECARGA OBLIGATORIA SI LA VERSION CAMBIO
            if (savedVersion !== currentVersion) {
                localStorage.setItem('danyFitness_version', currentVersion);
                
                const now = new Date();
                const dateStr = now.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: '2-digit' });
                const timeStr = now.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
                localStorage.setItem('danyFitness_buildTime', `${dateStr} ${timeStr}`);

                window.location.replace(window.location.pathname + '?v=1031_' + Date.now());
            }
        })();
    </script>
    
    <!-- HEADERS META CACHE CONTROL -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Dany Fitness - Workout Timer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B35;
            --secondary: #004E89;
            --dark: #1a1a1a;
            --light: #f5f5f5;
            --success: #00A86B;
            --warning: #FFA500;
            --danger: #d32f2f;
            --exercise-color: #00FF00;
            --rest-color: #FFD700;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--dark) 100%);

        }

        .tabs {

            background: rgba(255, 255, 255, 0.05);
            padding: 8px;

        .tab-btn {

        }

        .tab-btn.active {

        }

        }

        }

        .form-group label {

        .form-group input {

            border: 2px solid var(--secondary);

        .exercise-item {

            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;

        .exercise-info {

        }

        .exercise-name {

        }

        .exercise-time {

        }

        .btn-delete {

            color: white;

        }

        .button-group {

        .btn {

            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;

        .btn-primary {

        #timerMaximizeOverlay .btn-toggle-max {
            background: var(--warning);
            color: white;
        }
    </style>
</head>
<body>

    <script>
        let exercises = [];
        let currentExerciseIndex = 0;
        let currentSeriesIndex = 0;
        let totalSeries = 1;
        let seriesRestTimeSeconds = 60;
        let timerInterval = null;
        let timeLeft = 0;
        let isRunning = false;
        let trainingName = '';
        let isRestPeriod = false;
        let isSeriesRest = false;
        let hasStartedWorkout = false;
        
        let customBellSound = 'campana.mp3';
        let audioPlayer = null;
        
        let timerStartTime = 0;
        let timerTotalTime = 0;
        let lastPlayedBeepSecond = -1;
        
        let wakeLock = null;
        let audioCtx = null;

        function initBuildInfo() {
            const version = document.querySelector('meta[name="app-version"]').getAttribute('content');
            document.getElementById('headerVersion').textContent = `v${version}`;
        }

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        const unlockAudio = () => {
            getAudioContext();
            document.removeEventListener('touchstart', unlockAudio);
            document.removeEventListener('click', unlockAudio);
        };
        document.addEventListener('touchstart', unlockAudio, { once: true });
        document.addEventListener('click', unlockAudio, { once: true });

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.log(`Error Wake Lock: ${err.name}, ${err.message}`);
                }
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => {
                    wakeLock = null;
                });
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        function playTone(freq, type, duration, delay = 0) {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);

                gain.gain.setValueAtTime(0.4, ctx.currentTime + delay);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(ctx.currentTime + delay);
                osc.stop(ctx.currentTime + delay + duration);
            } catch (e) {
                console.log('Error de tono sintético:', e);
            }
        }

        function playBeep() {
            playTone(1000, 'square', 0.12);
        }

        function playNativeBell() {
            playTone(880, 'sine', 0.8, 0);
            playTone(520, 'sine', 1.0, 0);
        }

        function playCustomBellSound() {
            getAudioContext();
            if (customBellSound) {
                try {
                    if (!audioPlayer) {
                        audioPlayer = new Audio(customBellSound);
                    }
                    audioPlayer.pause();
                    audioPlayer.currentTime = 0;
                    
                    audioPlayer.play().catch(err => {
                        console.log('Fallo audio MP3, usando nativo:', err);
                        playNativeBell();
                    });
                } catch (err) {
                    console.log('Error creando objeto Audio, usando nativo:', err);
                    playNativeBell();
                }
            } else {
                playNativeBell();
            }
        }

        function playEndSound() {
            playCustomBellSound();
            setTimeout(() => playCustomBellSound(), 350);
        }

        function playRestSound() {
            playCustomBellSound();
        }

        function playStartSound() {
            playCustomBellSound();
        }

        function switchTab(tabName, event) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            if(event && event.target) {
                event.target.classList.add('active');
            }
        }

        function calculateTotalTime() {
            const series = parseInt(document.getElementById('seriesCount').value) || 1;
            const seriesRestMins = parseFloat(document.getElementById('seriesRestTime').value) || 0;
            const seriesRestSecs = seriesRestMins * 60;

            let totalSecondsPerSeries = 0;
            exercises.forEach(ex => {
                totalSecondsPerSeries += (ex.time || 0) + (ex.rest || 0);
            });

            let grandTotalSeconds = (totalSecondsPerSeries * series);
            if (series > 1) {
                grandTotalSeconds += (seriesRestSecs * (series - 1));
            }

            const mins = Math.floor(grandTotalSeconds / 60);
            const secs = grandTotalSeconds % 60;
            document.getElementById('totalSessionTime').textContent = 
                `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')} min`;
        }

        function addExercise() {
            let name = document.getElementById('exerciseName').value.trim();
            const time = parseInt(document.getElementById('exerciseTime').value);
            const rest = parseInt(document.getElementById('restTime').value);

            if (!time) {
                alert('Completa los campos');
                return;
            }

            if (!name) {
                name = `Ejercicio ${exercises.length + 1}`;
            }

            exercises.push({ name, time, rest });
            document.getElementById('exerciseName').value = '';
            renderExerciseList();
            calculateTotalTime();
        }

        function removeExercise(index) {
            exercises.splice(index, 1);
            renderExerciseList();
            calculateTotalTime();
        }

        function renderExerciseList() {
            const list = document.getElementById('exerciseList');
            list.innerHTML = exercises.map((ex, i) => `
                <div class="exercise-item">
                    <div class="exercise-info">
                        <div class="exercise-name">${ex.name}</div>
                        <div class="exercise-time">${ex.time}s ejercicio • ${ex.rest}s descanso</div>
                    </div>
                    <button class="btn-delete" onclick="removeExercise(${i})">✕</button>
                </div>
            `).join('');
            calculateTotalTime();
        }

        function savePreset() {
            const name = document.getElementById('trainingName').value || `Entrenamiento ${new Date().toLocaleString()}`;
            const series = parseInt(document.getElementById('seriesCount').value);
            const seriesRestMins = parseFloat(document.getElementById('seriesRestTime').value);

            const preset = {
                name,
                series,
                seriesRest: seriesRestMins,
                exercises: JSON.parse(JSON.stringify(exercises)),
                timestamp: new Date().getTime()
            };

            let presets = JSON.parse(localStorage.getItem('danyFitnessPresets')) || [];
            presets.push(preset);
            localStorage.setItem('danyFitnessPresets', JSON.stringify(presets));

            alert('✓ Entrenamiento guardado');
            renderPresets();
        }

        function renderPresets() {
            const list = document.getElementById('presetsList');
            let presets = JSON.parse(localStorage.getItem('danyFitnessPresets')) || [];

            if (presets.length === 0) {
                list.innerHTML = '<div class="alert">No hay entrenamientos guardados</div>';
                return;
            }

            list.innerHTML = presets.map((p, i) => `
                <div class="preset-item">
                    <div class="preset-info">
                        <div class="preset-name">${p.name}</div>
                        <div class="preset-details">${p.exercises.length} ejercicios • ${p.series} serie(s)</div>
                    </div>
                    <div class="preset-actions">
                        <button class="btn-small btn-load" onclick="loadPreset(${i})">Cargar</button>
                        <button class="btn-small btn-delete" onclick="deletePreset(${i})">✕</button>
                    </div>
                </div>
            `).join('');
        }

        function loadPreset(index) {
            let presets = JSON.parse(localStorage.getItem('danyFitnessPresets')) || [];
            const preset = presets[index];

            document.getElementById('trainingName').value = preset.name;
            document.getElementById('seriesCount').value = preset.series;
            document.getElementById('seriesRestTime').value = preset.seriesRest !== undefined ? preset.seriesRest : 1;
            exercises = JSON.parse(JSON.stringify(preset.exercises));

            ensureExerciseNames();
            renderExerciseList();
            calculateTotalTime();

            switchTab('config');
            alert('✓ Entrenamiento cargado');
        }

        function ensureExerciseNames() {
            exercises = exercises.map((ex, index) => {
                if (!ex.name || !ex.name.trim()) {
                    ex.name = `Ejercicio ${index + 1}`;
                }
                return ex;
            });
        }

        function deletePreset(index) {
            let presets = JSON.parse(localStorage.getItem('danyFitnessPresets')) || [];
            presets.splice(index, 1);
            localStorage.setItem('danyFitnessPresets', JSON.stringify(presets));
            renderPresets();
        }

        function clearAllPresets() {
            if (confirm('¿Eliminar todos los entrenamientos guardados?')) {
                localStorage.removeItem('danyFitnessPresets');
                renderPresets();
            }
        }

        function startWorkout() {
            if (exercises.length === 0) {
                alert('Agrega al menos un ejercicio');
                return;
            }

            getAudioContext();
            ensureExerciseNames();

            trainingName = document.getElementById('trainingName').value || 'Entrenamiento';
            totalSeries = parseInt(document.getElementById('seriesCount').value);
            const seriesRestMins = parseFloat(document.getElementById('seriesRestTime').value) || 0;
            seriesRestTimeSeconds = Math.round(seriesRestMins * 60);

            currentExerciseIndex = 0;
            currentSeriesIndex = 0;
            isSeriesRest = false;
            isRestPeriod = false;
            hasStartedWorkout = true;
            isRunning = true;

            switchTab('timer');
            
            const exercise = exercises[currentExerciseIndex];
            timeLeft = exercise.time;
            updateDisplay();
            playStartSound();
            playTimer();
        }

        function startWorkoutFromTimer() {
            startWorkout();
        }

        function nextStep() {
            if (currentExerciseIndex >= exercises.length) {
                currentExerciseIndex = 0;
                currentSeriesIndex++;

                if (currentSeriesIndex >= totalSeries) {
                    finishWorkout();
                    return;
                }

                if (seriesRestTimeSeconds > 0) {
                    timeLeft = seriesRestTimeSeconds;
                    isSeriesRest = true;
                    isRestPeriod = false;
                    hasStartedWorkout = true;
                    isRunning = true;
                    updateDisplay();
                    playStartSound(); 
                    playTimer();
                    return;
                }
            }

            const exercise = exercises[currentExerciseIndex];
            timeLeft = exercise.time;
            isRestPeriod = false;
            isSeriesRest = false;
            hasStartedWorkout = true;
            isRunning = true;
            updateDisplay();
            
            playStartSound();
            playTimer();
        }

        function playTimer() {
            getAudioContext();
            if (timerInterval) clearInterval(timerInterval);
            
            isRunning = true;
            hasStartedWorkout = true;

            requestWakeLock();
            updateControlButtons();

            timerStartTime = Date.now();
            timerTotalTime = timeLeft;
            lastPlayedBeepSecond = -1;

            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - timerStartTime) / 1000);
                timeLeft = Math.max(0, timerTotalTime - elapsed);
                updateDisplay();

                if (timeLeft <= 3 && timeLeft > 0 && lastPlayedBeepSecond !== timeLeft) {
                    playBeep();
                    lastPlayedBeepSecond = timeLeft;
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;

                    if (isSeriesRest) {
                        isSeriesRest = false;
                        nextStep();
                    } else if (!isRestPeriod) {
                        const isLastExercise = currentExerciseIndex === exercises.length - 1;

                        if (isLastExercise) {
                            currentExerciseIndex++;
                            nextStep();
                        } else {
                            timeLeft = exercises[currentExerciseIndex].rest;
                            isRestPeriod = true;
                            hasStartedWorkout = true;
                            isRunning = true;
                            updateDisplay();

                            if (timeLeft > 0) {
                                playRestSound();
                                playTimer();
                            } else {
                                currentExerciseIndex++;
                                nextStep();
                            }
                        }
                    } else {
                        isRestPeriod = false;
                        currentExerciseIndex++;
                        nextStep();
                    }
                }
            }, 250);
        }

        function pauseTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            isRunning = false;
            releaseWakeLock();
            updateControlButtons();
        }

        function handleSmartAction() {
            if (isRunning) {
                pauseTimer();
            } else if (hasStartedWorkout) {
                playTimer();
            }
        }

        function updateControlButtons() {
            const btnPlayMain = document.getElementById('btnPlayMain');
            const btnMain = document.getElementById('btnToggleMain');
            const btnStopMain = document.getElementById('btnStopMain');

            if (hasStartedWorkout) {
                if (btnPlayMain) btnPlayMain.style.display = 'none';
                if (btnMain) btnMain.style.display = 'block';
                if (btnStopMain) btnStopMain.style.display = 'block';
            } else {
                if (btnPlayMain) btnPlayMain.style.display = 'block';
                if (btnMain) btnMain.style.display = 'none';
                if (btnStopMain) btnStopMain.style.display = 'none';
            }

            let label = isRunning ? '⏸ PAUSAR' : '▶ REANUDAR';
            if (btnMain) btnMain.textContent = label;
            
            const btnMax = document.getElementById('btnToggleMax');
            if (btnMax) {
                btnMax.textContent = label;
                if (isRunning) {
                    btnMax.style.background = 'var(--warning)';
                } else {
                    btnMax.style.background = 'var(--success)';
                }
            }
        }

        function stopTimer() {
            pauseTimer();
            timeLeft = 0;
            currentExerciseIndex = 0;
            currentSeriesIndex = 0;
            isSeriesRest = false;
            isRestPeriod = false;
            hasStartedWorkout = false;
            releaseWakeLock();
            updateDisplay();
            updateControlButtons();
        }

        function stopTimerFromUI() {
            stopTimer();
            const overlay = document.getElementById('timerMaximizeOverlay');
            if (overlay.classList.contains('active')) {
                toggleMaximize();
            }
            document.getElementById('timerDisplay').textContent = '00:00';
            document.getElementById('timerStatus').textContent = '-';
            document.getElementById('timerInfo').textContent = 'Presiona COMENZAR para empezar';
            document.getElementById('exerciseName').textContent = '-';
            document.getElementById('nextStep').textContent = '-';
        }

        function toggleMaximize() {
            const overlay = document.getElementById('timerMaximizeOverlay');
            overlay.classList.toggle('active');
            if (overlay.classList.contains('active')) {
                requestWakeLock();
                updateControlButtons();
            } else if (!isRunning) {
                releaseWakeLock();
            }
        }

        function updateDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

            document.getElementById('timerDisplay').textContent = timeStr;
            document.getElementById('timerDisplayMax').textContent = timeStr;

            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('currentTimeMax').textContent = `${hours}:${minutes}`;

            let rawNextText = '';

            if (isSeriesRest) {
                const totalTime = seriesRestTimeSeconds;
                const progress = totalTime > 0 ? ((totalTime - timeLeft) / totalTime) * 100 : 0;
                document.getElementById('progressBar').style.width = progress + '%';
                document.getElementById('timerStatus').textContent = '🔄 DESCANSO SERIE';
                document.getElementById('timerInfo').textContent =
                    `Serie ${currentSeriesIndex} de ${totalSeries} completada`;
                document.getElementById('currentSeries').textContent =
                    `${currentSeriesIndex}/${totalSeries}`;
                document.getElementById('exerciseName').textContent = 'Descanso Serie';
                document.getElementById('exerciseNameMax').textContent = 'Descanso Serie';
                
                rawNextText = currentSeriesIndex < totalSeries ? 'Nueva serie' : 'Fin del entrenamiento';
                const nextStepFormatted = `(Próximo: ${rawNextText})`;
                document.getElementById('nextStep').textContent = nextStepFormatted;
                document.getElementById('nextStepMax').textContent = nextStepFormatted;

                const seriesText = `Serie: ${currentSeriesIndex}/${totalSeries} | Ejercicios: --/--`;
                document.getElementById('seriesInfo').textContent = seriesText;
                document.getElementById('seriesInfoMax').textContent = seriesText;

                document.getElementById('exerciseName').style.color = 'var(--rest-color)';
                document.getElementById('timerDisplay').style.color = 'var(--rest-color)';

                const overlay = document.getElementById('timerMaximizeOverlay');
                overlay.classList.add('rest-mode');
            } else {
                const exercise = exercises[currentExerciseIndex];
                if (!exercise) return;

                const totalTime = isRestPeriod ? exercise.rest : exercise.time;
                const progress = totalTime > 0 ? ((totalTime - timeLeft) / totalTime) * 100 : 0;

                document.getElementById('progressBar').style.width = progress + '%';
                document.getElementById('timerStatus').textContent =
                    isRestPeriod ? '⏸ DESCANSO' : '💪 EJERCICIO';
                document.getElementById('timerInfo').textContent =
                    `Serie ${currentSeriesIndex + 1} de ${totalSeries}`;

                document.getElementById('currentSeries').textContent =
                    `${currentSeriesIndex + 1}/${totalSeries}`;

                let exerciseDisplayName;
                if (isRestPeriod) {
                    exerciseDisplayName = 'Descanso';
                } else {
                    exerciseDisplayName = exercise.name || `Ejercicio ${currentExerciseIndex + 1}`;
                }
                document.getElementById('exerciseName').textContent = exerciseDisplayName;
                document.getElementById('exerciseNameMax').textContent = exerciseDisplayName;

                if (isRestPeriod) {
                    if (currentExerciseIndex + 1 < exercises.length) {
                        rawNextText = exercises[currentExerciseIndex + 1].name;
                    } else {
                        rawNextText = currentSeriesIndex + 1 < totalSeries ? 'Descanso de serie' : 'Fin del entrenamiento';
                    }
                } else {
                    const isLastExercise = currentExerciseIndex === exercises.length - 1;
                    if (isLastExercise) {
                        rawNextText = currentSeriesIndex + 1 < totalSeries ? 'Descanso de serie' : 'Fin del entrenamiento';
                    } else {
                        rawNextText = 'Descanso';
                    }
                }

                const nextStepFormatted = `(Próximo: ${rawNextText})`;
                document.getElementById('nextStep').textContent = nextStepFormatted;
                document.getElementById('nextStepMax').textContent = nextStepFormatted;

                const seriesText = `Serie: ${currentSeriesIndex + 1}/${totalSeries} | Ejercicio: ${currentExerciseIndex + 1}/${exercises.length}`;
                document.getElementById('seriesInfo').textContent = seriesText;
                document.getElementById('seriesInfoMax').textContent = seriesText;

                const overlay = document.getElementById('timerMaximizeOverlay');
                if (isRestPeriod) {
                    document.getElementById('exerciseName').style.color = 'var(--rest-color)';
                    document.getElementById('timerDisplay').style.color = 'var(--rest-color)';
                    overlay.classList.add('rest-mode');
                } else {
                    document.getElementById('exerciseName').style.color = 'var(--exercise-color)';
                    document.getElementById('timerDisplay').style.color = 'var(--exercise-color)';
                    overlay.classList.remove('rest-mode');
                }
            }

            const totalTime = isSeriesRest ? seriesRestTimeSeconds : (exercises[currentExerciseIndex] ? (isRestPeriod ? exercises[currentExerciseIndex].rest : exercises[currentExerciseIndex].time) : 0);
            if (totalTime > 0) {
                const progress = ((totalTime - timeLeft) / totalTime) * 100;
                document.getElementById('progressBarMax').style.width = progress + '%';
            }
        }

        function finishWorkout() {
            pauseTimer();
            releaseWakeLock();
            hasStartedWorkout = false;
            document.getElementById('timerDisplay').textContent = '¡LISTO!';
            document.getElementById('timerStatus').textContent = '✓ COMPLETADO';
            updateControlButtons();
            playEndSound();
        }

        initBuildInfo();
        renderExerciseList();
        renderPresets();
        calculateTotalTime();
        updateDisplay();
        updateControlButtons();
    </script>
</body>
</html>
